server.port=8080
spring.application.name=storage-engine

iginx.host=127.0.0.1
iginx.port=6888
iginx.username=root
iginx.password=root

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# IGinX node hot-add defaults
deploy.iginx.script-path=/home/ubuntu/ScaleStore/backend/scripts/deploy_iginx.sh
deploy.iginx.default-package-path=/home/ubuntu/ScaleStore/backend/packages/IGinX-FastDeploy-0.8.0.tar.gz
deploy.iginx.default-zk-connection=127.0.0.1:2181
deploy.iginx.default-directory=~

# Metadata graph (Neo4j)
metadata.neo4j.enabled=true
metadata.neo4j.uri=bolt://127.0.0.1:7687
metadata.neo4j.username=neo4j
metadata.neo4j.password=password

# LLM (OpenAI-compatible API). For Zhipu, set base-url to: https://open.bigmodel.cn/api/paas/v4
metadata.llm.enabled=true
metadata.llm.base-url=https://open.bigmodel.cn/api/paas/v4
metadata.llm.api-key=
metadata.llm.model=glm-4-flash
metadata.llm.vision-model=glm-4v-flash
#metadata.llm.base-url=http://localhost:8000/v1
#metadata.llm.api-key=dummy-key
#metadata.llm.model=Qwen3.5-27B
#metadata.llm.vision-model=Qwen3.5-27B

metadata.extraction.max-concurrency=2
