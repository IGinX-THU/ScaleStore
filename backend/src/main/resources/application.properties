server.port=8080
grpc.server.port=9090
spring.application.name=storage-engine

iginx.host=127.0.0.1
iginx.port=6888
iginx.username=root
iginx.password=root

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Shared dependency resource root.
# Supported formats:
# 1) classpath root/folder, e.g. classpath:/ or classpath:/assets
# 2) filesystem folder, e.g. /opt/scalestore/resources or file:/opt/scalestore/resources
resource.base-path=classpath:/

# IGinX node hot-add defaults
deploy.iginx.default-package-path=~/iginx-0.9.0-SNAPSHOT.tar.gz
deploy.iginx.default-zk-connection=127.0.0.1:2181
deploy.iginx.default-directory=~
deploy.iginx.default-python-cmd=python3

# Metadata graph (Neo4j)
metadata.neo4j.enabled=true
metadata.neo4j.uri=bolt://127.0.0.1:7687
metadata.neo4j.username=neo4j
metadata.neo4j.password=password

# LLM (OpenAI-compatible API)
metadata.llm.enabled=true
metadata.llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
metadata.llm.api-key=sk-xx
metadata.llm.model=qwen3.6-27b
metadata.llm.vision-model=qwen3.6-27b
#metadata.llm.base-url=http://localhost:8000/v1
#metadata.llm.api-key=dummy-key
#metadata.llm.model=Qwen3.5-27B
#metadata.llm.vision-model=Qwen3.5-27B

metadata.extraction.enabled=true
metadata.extraction.scan-interval-ms=5000
metadata.graph-max-triples=200
