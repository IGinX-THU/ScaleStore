taskList:
  - taskType: "sql"
    dataFlowType: "stream"
    timeout: 10000000
    sqlList:
      - SELECT key AS k, logicalPath AS lp, fileName AS fn, dataType AS dt, fileFormat AS ff, fileSize AS fs, createTime AS ct, contentPath AS cp FROM storage.meta WHERE knowledgeExtractStatus = 'PENDING' OR knowledgeExtractStatus = 'FAILED' ORDER BY key ASC LIMIT 1;
  - taskType: "python"
    dataFlowType: "stream"
    timeout: 10000000
    pyTaskName: "MetadataExtractInfoTransformer"
    outputPrefix: "metaInfo"
  - taskType: "sql"
    dataFlowType: "stream"
    timeout: 10000000
    sqlList:
      - INSERT INTO storage.meta(key, knowledgeExtractStatus) VALUES (SELECT k AS key, 'PROCESSING' FROM metaInfo);
      - SELECT * FROM (SELECT VALUE2META(SELECT cp FROM metaInfo) FROM data LIMIT 1) FULL OUTER JOIN (SELECT k AS metaInfo_key, lp AS metaInfo_logicalPath, fn AS metaInfo_fileName, dt AS metaInfo_dataType, ff AS metaInfo_fileFormat, fs AS metaInfo_fileSize, ct AS metaInfo_createTime, cp AS metaInfo_contentPath FROM metaInfo);
  - taskType: "python"
    dataFlowType: "stream"
    timeout: 10000000
    pyTaskName: "MetadataExtractExeTransformer"
    outputPrefix: "extractionResult"
  - taskType: "sql"
    dataFlowType: "stream"
    timeout: 10000000
    sqlList:
      - INSERT INTO storage.meta(key, knowledgeExtractStatus) VALUES (SELECT metaKey AS key, status FROM extractionResult);
      - SELECT metaKey AS `metaExtract.key`, logicalPath AS `metaExtract.logicalPath`, fileName AS `metaExtract.fileName`, status AS `metaExtract.status`, message AS `metaExtract.message`, entityCount AS `metaExtract.entityCount`, relationCount AS `metaExtract.relationCount`, detailsJson AS `metaExtract.detailsJson`, error AS `metaExtract.error` FROM extractionResult;

exportType: "IGinX"
schedule: "every 15 second"
stopOnFailure: false
