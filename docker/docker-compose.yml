# ScaleStore Docker Cluster - 23 IGinX Nodes
#
# Host node (node 1): ZooKeeper + IGinX running directly on host machine
# Docker nodes (node 2-24): 23 containers, each with SSH + JDK
#
# Port mapping scheme:
#   SSH ports:   2201 - 2223  (container internal: 22)
#   IGinX ports: 6889 - 6911  (container internal: same as external)
#
# Network configuration:
#   Network: scalestore-cluster (172.25.0.0/16)
#   Fixed IPs: 172.25.0.2 - 172.25.0.24 (node-02 to node-24)
#
# All containers connect to host ZooKeeper at host.docker.internal:2181
#
# Default SSH credentials: root / scalestore

networks:
  scalestore-cluster:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

x-iginx-node: &iginx-node
  image: scalestore-iginx-node:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    scalestore-cluster: {}

services:
  iginx-node-02:
    <<: *iginx-node
    container_name: iginx-node-02
    hostname: iginx-node-02
    networks:
      scalestore-cluster:
        ipv4_address: 172.25.0.2
    ports:
      - "2201:22"
      - "6889:6889"

  iginx-node-03:
    <<: *iginx-node
    container_name: iginx-node-03
    hostname: iginx-node-03
    networks:
