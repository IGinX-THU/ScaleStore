<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可扩展存储引擎 - 可视化平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ===== 顶部标题栏 ===== -->
  <header class="dashboard-header">
    <div class="header-left">
      <span class="status-dot"></span>
      <span class="status-text">系统运行中</span>
    </div>
    <div class="header-center">
      <div class="header-title">
        <span class="header-deco">◆</span>
        <span class="header-deco-line"></span>
        <h1>可扩展存储引擎可视化平台</h1>
        <span class="header-deco-line"></span>
        <span class="header-deco">◆</span>
      </div>
    </div>
    <div class="header-right">
      <span>在线节点: <em id="online-nodes">8</em></span>
      <span class="divider">|</span>
      <span id="current-time">2026-02-25 12:00:00</span>
    </div>
  </header>

  <!-- ===== 仪表盘主体 ===== -->
  <main class="dashboard-grid">

    <!-- ====== 1.1 集群管理 ====== -->
    <section class="panel panel-cluster">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>集群管理</span></div>
        <div class="panel-actions">
          <button id="cluster-add-btn" class="btn btn-primary btn-sm">添加节点</button>
        </div>
      </div>
      <div class="panel-body flex-col gap-4">
        <div class="table-wrapper flex-1">
          <table>
            <thead>
              <tr><th>节点名</th><th>节点IP</th><th>端口</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="cluster-table-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="cluster-pagination"></div>
      </div>
    </section>

    <!-- ====== 1.1 节点拓扑图 ====== -->
    <section class="panel panel-topology">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>节点拓扑图</span></div>
      </div>
      <div class="panel-body" style="padding: 4px;">
        <div id="cluster-topology" class="chart-container"></div>
      </div>
    </section>

    <!-- ====== 1.2 用户管理 ====== -->
    <section class="panel panel-user">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>用户管理</span></div>
        <div class="panel-actions">
          <button id="user-add-btn" class="btn btn-primary btn-sm">新增用户</button>
        </div>
      </div>
      <div class="panel-body flex-col gap-4">
        <div class="table-wrapper flex-1">
          <table>
            <thead>
              <tr><th>用户名</th><th>用户类型</th><th>邮箱</th><th>电话</th><th>操作</th></tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="user-pagination"></div>
      </div>
    </section>

    <!-- ====== 1.3 策略管理 ====== -->
    <section class="panel panel-policy">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>策略管理</span></div>
        <div class="panel-actions">
          <button id="policy-edit-btn" class="btn btn-info btn-sm">设置</button>
          <button id="policy-save-btn" class="btn btn-primary btn-sm hidden">保存</button>
          <button id="policy-cancel-btn" class="btn btn-secondary btn-sm hidden">取消</button>
        </div>
      </div>
      <div class="panel-body flex-col gap-4">
        <div class="table-wrapper flex-1">
          <table>
            <thead>
              <tr><th>策略项</th><th>数值</th><th>描述</th></tr>
            </thead>
            <tbody id="policy-table-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="policy-pagination"></div>
      </div>
    </section>

    <!-- ====== 2. 元数据服务 ====== -->
    <section class="panel panel-metadata">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>元数据图谱</span></div>
        <div class="panel-actions">
          <input type="text" id="metadata-search-input" class="input input-sm" placeholder="输入节点名称..." style="width:150px;">
          <button id="metadata-search-btn" class="btn btn-info btn-sm">查找</button>
          <button id="metadata-build-btn" class="btn btn-primary btn-sm">构建网络</button>
        </div>
      </div>
      <div class="panel-body" style="padding: 4px;">
        <div id="metadata-graph" class="chart-container"></div>
      </div>
    </section>

    <!-- ====== 3. 存储服务 ====== -->
    <section class="panel panel-storage">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>存储服务</span></div>
      </div>
      <div class="panel-body flex-col gap-8">
        <div class="form-group">
          <label class="form-label">数据类型</label>
          <select id="storage-type-select" class="input">
            <option value="relational">关系数据</option>
            <option value="timeseries">时序数据</option>
            <option value="document">文档数据</option>
            <option value="image">图像数据</option>
            <option value="keyvalue">键值数据</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">逻辑路径</label>
          <input type="text" id="storage-path-input" class="input" placeholder="/data/project/dataset">
        </div>
        <div class="form-group flex-1">
          <label class="form-label">文件上传</label>
          <div id="storage-upload" class="upload-zone">
            <div class="upload-icon">📂</div>
            <p class="upload-text">拖拽文件到此处或点击上传</p>
            <p class="upload-hint">选择一个文件上传</p>
            <input type="file" class="hidden" id="file-input">
          </div>
          <div id="file-list" class="file-list"></div>
        </div>
        <button id="storage-save-btn" class="btn btn-primary w-full">存储</button>
      </div>
    </section>

    <!-- ====== 4. 访问服务 ====== -->
    <section class="panel panel-access">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>访问服务</span></div>
      </div>
      <div class="panel-body">
        <div class="access-layout">
          <!-- 左侧控制区 -->
          <div class="access-sidebar">
            <div class="form-group">
              <label class="form-label">逻辑路径</label>
              <input type="text" id="access-path-input" class="input" placeholder="/data/project/dataset">
            </div>
            <button id="access-visit-btn" class="btn btn-primary w-full">访问</button>
            <div class="data-info flex-col gap-6">
              <div class="data-info-item">
                <span class="data-info-label">数据类型:</span>
                <span class="data-info-value" id="access-data-type">-</span>
              </div>
              <div class="data-info-item">
                <span class="data-info-label">数据大小:</span>
                <span class="data-info-value" id="access-data-size">-</span>
              </div>
              <div class="data-info-item">
                <span class="data-info-label">创建时间:</span>
                <span class="data-info-value" id="access-data-time">-</span>
              </div>
            </div>
            <button id="access-download-btn" class="btn btn-info w-full">点击下载数据</button>
          </div>
          <!-- 右侧预览区 -->
          <div class="access-main">
            <div class="access-main-header">
              <span style="font-size:12px; color:var(--text-label); font-weight:600;">数据预览</span>
            </div>
            <div id="access-preview" class="preview-area flex-1">
              <div class="preview-placeholder">请输入路径并点击访问按钮查看数据</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ====== 5. 多样化接口服务 ====== -->
    <section class="panel panel-interface">
      <div class="panel-corner-bl"></div>
      <div class="panel-corner-br"></div>
      <div class="panel-header">
        <div class="panel-title"><span>多样化接口服务</span></div>
        <div class="panel-actions">
          <button id="interface-btn-rest" class="tab-btn active">Restful API</button>
          <button id="interface-btn-java" class="tab-btn">Java gRPC</button>
          <button id="interface-btn-python" class="tab-btn">Python gRPC</button>
        </div>
      </div>
      <div class="panel-body flex-col gap-4">
        <div class="table-wrapper flex-1">
          <table>
            <thead>
              <tr><th>接口名</th><th>URL</th><th>接口描述</th><th>操作</th></tr>
            </thead>
            <tbody id="interface-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== 模态框: 节点管理 ===== -->
  <div id="modal-cluster" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="cluster-modal-title">添加节点</span>
        <button class="modal-close" id="cluster-modal-close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">节点名</label>
          <input type="text" id="cluster-name-input" class="input" placeholder="node-01">
        </div>
        <div class="form-group">
          <label class="form-label">节点IP</label>
          <input type="text" id="cluster-ip-input" class="input" placeholder="192.168.1.100">
        </div>
        <div class="form-group">
          <label class="form-label">IGinX端口（可选，默认6888）</label>
          <input type="text" id="cluster-port-input" class="input" placeholder="6888">
        </div>
        <div class="form-group">
          <label class="form-label">SSH用户名</label>
          <input type="text" id="cluster-ssh-user-input" class="input" placeholder="ubuntu">
        </div>
        <div class="form-group">
          <label class="form-label">SSH密码</label>
          <input type="password" id="cluster-ssh-password-input" class="input" placeholder="请输入目标节点登录密码">
        </div>
        <div class="form-group">
          <label class="form-label">远程部署目录</label>
          <input type="text" id="cluster-deploy-dir-input" class="input" placeholder="/opt/iginx">
        </div>
        <div class="form-group">
          <label class="form-label">部署包路径（可选）</label>
          <input type="text" id="cluster-package-path-input" class="input" placeholder="/home/ubuntu/IGinX-FastDeploy-0.8.0.tar.gz">
        </div>
        <div class="form-group">
          <label class="form-label">ZooKeeper连接串</label>
          <input type="text" id="cluster-zk-input" class="input" placeholder="192.168.1.100:2181">
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea id="cluster-desc-input" class="input" rows="2" placeholder="节点描述信息"></textarea>
        </div>
        <div class="form-group hidden" id="cluster-deploy-progress-wrap">
          <label class="form-label">部署进度</label>
          <div id="cluster-deploy-current-step" class="code-block" style="white-space:normal;padding:8px 10px;">等待开始...</div>
          <pre id="cluster-deploy-log" class="code-block" style="max-height:150px;overflow:auto;">暂无日志</pre>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cluster-modal-cancel" class="btn btn-secondary">取消</button>
        <button id="cluster-modal-save" class="btn btn-primary">确认</button>
      </div>
    </div>
  </div>

  <!-- ===== 模态框: 用户管理 ===== -->
  <div id="modal-user" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title" id="user-modal-title">新增用户</span>
        <button class="modal-close" id="user-modal-close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" id="user-name-input" class="input" placeholder="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="user-password-input" class="input" placeholder="********">
        </div>
        <div class="form-group">
          <label class="form-label">用户类型</label>
          <select id="user-type-input" class="input">
            <option value="admin">超级管理员</option>
            <option value="user" selected>普通用户</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="text" id="user-email-input" class="input" placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">电话</label>
          <input type="text" id="user-phone-input" class="input" placeholder="13800138000">
        </div>
      </div>
      <div class="modal-footer">
        <button id="user-modal-cancel" class="btn btn-secondary">取消</button>
        <button id="user-modal-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 抽屉: 接口详情 ===== -->
  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <div id="drawer-interface" class="drawer">
    <div class="drawer-header">
      <span class="drawer-title">接口详情</span>
      <button class="modal-close" id="drawer-close">&times;</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <div class="drawer-label">接口名称</div>
        <div class="drawer-value" id="drawer-interface-name">-</div>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">URL</div>
        <div class="code-block" id="drawer-interface-url">-</div>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">接口类型</div>
        <span class="type-badge" id="drawer-interface-type">-</span>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">接口描述</div>
        <div class="drawer-value" id="drawer-interface-desc">-</div>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">请求参数</div>
        <pre class="code-block" id="drawer-interface-params">-</pre>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">返回示例</div>
        <pre class="code-block" id="drawer-interface-response">-</pre>
      </div>
      <div class="drawer-section">
        <div class="drawer-label">示例代码</div>
        <pre class="code-block" id="drawer-interface-code">-</pre>
      </div>
    </div>
    <div class="drawer-footer">
      <button id="interface-download-btn" class="btn btn-primary w-full">下载示例代码</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
